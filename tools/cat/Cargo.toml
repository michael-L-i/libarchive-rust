[package]
name = "bsdcat"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "BSD-2-Clause"
description = "bsdcat: expands compressed files to standard output (upstream's cat/)"

[[bin]]
name = "bsdcat"
path = "src/bsdcat.rs"

[dependencies]
libarchive-fe = { path = "../libarchive_fe" }
libarchive-rust = { path = "../.." }
libc = "0.2"
