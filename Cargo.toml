[package]
name = "libarchive-rust"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[lib]
name = "archive"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
libc = "0.2"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "safe-encode"] }
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh32"] }
crabz2 = { version = "0.7.0", default-features = false }
ruzstd = "0.9.0"

[build-dependencies]
cc = "1"

# The oracle runs upstream's tests against the dev build; unoptimized, the
# fuzz tests take ~25x upstream's time. Keep debug assertions and overflow
# checks, but optimize.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
crc32fast = "1"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "encoder"] }
