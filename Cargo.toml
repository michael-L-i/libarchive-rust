[workspace]
members = ["capi", "deflate"]
default-members = [".", "capi", "deflate"]
# The patched backends keep their own manifests and tests.
exclude = ["vendor"]

[package]
name = "libarchive-rust"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"

[dependencies]
crc32fast = "1.5.2"
deflate = { path = "deflate" }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
libc = "0.2"
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "lzip", "encoder"] }
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "safe-encode", "alloc"] }
xxhash-rust = { version = "0.8.19", default-features = false, features = ["xxh32"] }
crabz2 = { version = "0.7.0", default-features = false, features = ["std"] }
ruzstd = "0.9.0"
md-5 = { version = "0.11", default-features = false, features = ["alloc"] }
ripemd = { version = "0.2", default-features = false, features = ["alloc"] }
sha1 = { version = "0.11", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes = { version = "0.9", default-features = false }
xml = { version = "1.4.0", default-features = false }

# The oracle runs upstream's tests against the dev build; unoptimized, the
# fuzz tests take ~25x upstream's time. Keep debug assertions and overflow
# checks, but optimize.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "xz", "lzip", "encoder"] }

[patch.crates-io]
miniz_oxide = { path = "vendor/miniz_oxide" }
lzma-rust2 = { path = "vendor/lzma-rust2" }
ruzstd = { path = "vendor/ruzstd" }
