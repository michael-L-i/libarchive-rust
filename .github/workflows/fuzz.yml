name: Archive properties

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - name: Check property harness
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path fuzz/Cargo.toml --lib -- --nocapture
      - name: Install and build fuzz targets
        run: |
          cargo install cargo-fuzz --locked
          cd fuzz
          cargo fuzz build
      - name: Seed deterministic properties
        run: |
          scripts/fuzz-seeds
          scripts/fuzz-writer-seeds
      - name: Run bounded property smoke campaigns
        working-directory: fuzz
        run: |
          for target in writer_tar writer_zip writer_cpio writer_ar writer_7zip writer_xar writer_iso9660 writer_roundtrip read_limits all_deep; do
            cargo fuzz run "$target" -- -runs=100 -timeout=10 -rss_limit_mb=1024 -malloc_limit_mb=256
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: archive-property-failures
          path: fuzz/artifacts
          if-no-files-found: ignore
