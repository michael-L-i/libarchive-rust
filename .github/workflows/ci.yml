name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust 1.97.1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux test dependencies and locales
        if: runner.os == 'Linux'
        run: scripts/setup-linux-tests
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The dev profile keeps debug assertions and overflow checks on.
      - run: cargo test --workspace --locked

  oracle:
    name: Upstream test suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install upstream's build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake xz zstd lz4 libb2 libiconv
      - name: Install upstream's build dependencies and locales (Linux)
        if: runner.os == 'Linux'
        run: scripts/setup-linux-tests
      - name: Require an unprivileged test user
        run: test "$(id -u)" -ne 0
      - name: Build upstream libarchive (the oracle)
        run: scripts/build-oracle
      - name: Run upstream's tests against the oracle
        run: scripts/run-tests --oracle --suite all --timeout 120
      - name: Build the port (dev profile, with assertions) and relink upstream's tests
        run: scripts/build-port
      - name: Run upstream's tests against the port
        run: scripts/run-tests --suite all --timeout 120
      - name: Verify corrected zisofs images with upstream's reader
        run: scripts/test-iso-zisofs --library target/debug --reader build/oracle/bin/bsdtar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: upstream-failures-${{ matrix.os }}
          path: |
            build/oracle/build.log
            build/oracle/config.h
            build/oracle/results.tsv
            build/oracle/logs
            build/port/results.tsv
            build/port/logs
          if-no-files-found: ignore
